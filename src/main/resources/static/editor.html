<!DOCTYPE html>
<html lang="en">
<head>
   <title>Resume Editor - Rezumio</title>
   <link rel="stylesheet" href="editor.css">
</head>
<body>
   <div class="container">
       <!-- Sidebar -->
       <aside class="sidebar">
           <div class="logo">Rezumio</div>
           <nav>
               <ul id="dynamicSidebar">
                   <!-- Sections will be inserted here dynamically -->
               </ul>
           </nav>
       </aside>

       <!-- Main Content -->
       <main class="main-content">
           <!-- Form Section -->
           <section id="form-section">
               <form id="resumeForm">
                   <!-- Dynamic sections will be inserted here -->
               </form>
           </section>
       </main>

       <!-- Tips Section -->
       <aside class="tips-section">
           <!-- Tips will be dynamically inserted based on the section -->
       </aside>
       <img src="https://i.ibb.co/2YKqz8nQ/Screenshot-2025-04-02-at-1-37-30-AM.jpg" alt="Button Image" class="bottom-right-btn" onclick="saveFormData(); window.location.href='gemini.html?template=' + encodeURIComponent(new URLSearchParams(window.location.search).get('template'))">
   </div>

   <script src="editor.js"></script>
</body>
</html>
